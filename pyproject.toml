[project]
name = "mvp"
version = "0.1.0"
description = "Minimum Viable Perseus — static site compiler for the Perseus Digital Library"
authors = [
    {name = "Cliff Wulfman", email = "cwulfman@princeton.edu"},
    {name = "Charles Pletcher", email = "charles.pletcher@tufts.edu"},
    {name = "Peter Nadel", email = "peter.nadel@tufts.edu"}
]
dependencies = [
    "lxml>=6.0.4",
    "lxml-stubs>=0.5.1",
    "saxonche>=12.9.0",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "frozen-flask>=1.0.2",
    "markdown>=3.10.2",
    "perseus-cts",
    "citation-resolution",
    "kodon-py",
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
mvp-dev = "mvp.site.app:main"
mvp-build = "mvp.site.app:build"
mvp-proto = "mvp.scripts.proto:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mvp"]

[tool.uv.sources]
citation-resolution = {git = "https://github.com/PerseusDLCode/citation-resolution", rev = "d28f14e160cc2f12ae832abe47925f40ede0af95"}
kodon-py = {git="https://github.com/PerseusDLCode/kodon-py", rev = "b925cf4cb7254e641ab50075dbb1048fc9bc5cfc"}
perseus-cts = { git = "https://github.com/PerseusDLCode/perseus-cts.git", rev = "9da71f0d32fefce079d35a3ec88d38b0b61576ae" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--cov=mvp --cov-report=term-missing"
markers = ["slow: marks tests as slow integration tests requiring Saxon (deselect with -m 'not slow')"]

[tool.ruff]
exclude = ["wiki/"]

[tool.coverage.run]
source = ["src/mvp"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.11.3",
    "mypy>=1.15.0",
]
morph = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
]
