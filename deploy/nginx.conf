# Mounted over nginx:alpine's stock /etc/nginx/conf.d/default.conf (see
# compose.yaml). The first and last blocks reproduce the stock server
# unchanged; /search-index/ is the only addition.

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # The corpus search index (SEARCH_DIR, mounted at /srv/search-index):
    # manifest.json plus the content-addressed search-<sha12>.db it names.
    # /search reads the database piecemeal over HTTP range requests
    # (sql.js-httpvfs), which nginx answers natively for static files.
    # Kept outside /usr/share/nginx/html because BUILD_DIR is swapped
    # wholesale on every page deploy and the index updates on its own
    # schedule (see cron-deploy.sh).
    location /search-index/ {
        root /srv;
        # Ranges must address the file's own bytes; nothing to gain
        # compressing SQLite pages anyway. Any reverse proxy in front must
        # likewise pass Range through and not compress these responses.
        gzip off;

        # A given search-<sha12>.db never changes once published, so
        # browsers may keep every page of it they've fetched.
        location ~ ^/search-index/search-[0-9a-f]+\.db$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Always revalidated: it's how clients find the current database.
        location = /search-index/manifest.json {
            add_header Cache-Control "no-cache";
        }

        # cron-deploy.sh's in-progress downloads (.incoming.*).
        location ~ /\. {
            deny all;
        }
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
