services:
  serve:
    image: nginx:alpine
    container_name: "${SERVE_CTR:-mvp-serve}"
    ports:
      - "${SERVE_PORT:-8000}:80"
    volumes:
      # BUILD_DIR is repopulated by swapping in a freshly-built directory
      # (two renames) rather than editing files in place; `serve` must be
      # force-recreated after each deploy so the bind mount re-resolves the
      # new directory's inode — see cron-deploy.sh.
      - "${BUILD_DIR:-./build}:/usr/share/nginx/html:ro,z"
      # The corpus search index, served at /search-index/ (see nginx.conf).
      # Updated in place by cron-deploy.sh, independently of BUILD_DIR.
      - "${SEARCH_DIR:-./search-index}:/srv/search-index:ro,z"
      # cron-deploy.sh exports BUILD_DIR, SEARCH_DIR and DEPLOY_DIR as
      # absolute paths; the relative defaults are only for running compose
      # by hand from this directory.
      - "${DEPLOY_DIR:-.}/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z"
    restart: unless-stopped

  # No `build` service anymore: the freeze now runs in CI (see
  # MinimumViablePerseus's build-corpus.yml/build-global.yml), which
  # produces finished static pages as GHCR artifacts. cron-deploy.sh pulls
  # and extracts those directly — nothing runs a build container on this
  # host anymore, which is also why MVP_BUILD_WORKERS being pinned to 1
  # here previously (multiprocess freezing locked this VM up under load)
  # is no longer relevant to this file.
