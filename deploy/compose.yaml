services:
  serve:
    image: nginx:alpine
    container_name: "${SERVE_CTR:-mvp-serve}"
    ports:
      - "${SERVE_PORT:-8000}:80"
    volumes:
      # BUILD_DIR is a symlink to whichever blue-green directory is live;
      # `serve` must be force-recreated after the symlink flips so the bind
      # mount re-resolves it — see cron-deploy.sh.
      - "${BUILD_DIR:-./build}:/usr/share/nginx/html:ro,z"
    restart: unless-stopped

  # No `build` service anymore: the freeze now runs in CI (see
  # MinimumViablePerseus's build-corpus.yml/build-global.yml), which
  # produces finished static pages as GHCR artifacts. cron-deploy.sh pulls
  # and extracts those directly — nothing runs a build container on this
  # host anymore, which is also why MVP_BUILD_WORKERS being pinned to 1
  # here previously (multiprocess freezing locked this VM up under load)
  # is no longer relevant to this file.
