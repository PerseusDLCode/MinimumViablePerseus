name: Build corpus artifacts

# Builds each corpus's static pages independently and in parallel (see
# Dockerfile.corpus / `mvp-build --mode corpus-only`), instead of the single
# combined build in build-and-release.yml. Each matrix leg pushes its own
# frozen-pages tarball + manifest.json as an OCI artifact to GHCR, tagged by
# that corpus's HEAD SHA; build-global.yml consumes the manifests to
# regenerate /, /collections/, /urn-index.json, /research/ once any corpus
# changes.
#
# NOTE: this workflow has not yet been run for real — it hasn't been
# exercised against live GHCR credentials or a live corpus checkout.
# workflow_dispatch a single corpus first and inspect the pushed artifact
# before relying on the push-triggered path.

on:
  workflow_dispatch:
    inputs:
      corpus:
        description: >-
          Build only this corpus (greekLit, latinLit, First1KGreek).
          Leave blank to build all three.
        required: false
      force:
        description: >-
          Rebuild and push even if this corpus's SHA already has a pushed
          artifact. The skip check only keys on the corpus's own git SHA,
          not on mvp-build's code — so a build-image/app.py-only change
          (no corpus content change) needs this to actually take effect.
        type: boolean
        default: false
  push:
    branches: [dev]
    paths:
      - Dockerfile.corpus
      - src/**
      - pyproject.toml
      - uv.lock

permissions:
  contents: read
  packages: write

jobs:
  # Fetches canonical-pdlrefwk (public repo — commentary-linking data every
  # corpus build needs, see Dockerfile.corpus) exactly once and shares it
  # with all three matrix legs below via a build artifact, instead of each
  # leg re-cloning the same repo independently.
  fetch-pdlrefwk:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.pdlrefwk }}
    steps:
      - name: Resolve canonical-pdlrefwk HEAD SHA
        id: sha
        run: |
          SHA=$(git ls-remote https://github.com/PerseusDLCode/canonical-pdlrefwk refs/heads/dev | cut -f1)
          if [ -z "$SHA" ]; then
            echo "Could not resolve HEAD SHA for canonical-pdlrefwk@dev" >&2
            exit 1
          fi
          echo "pdlrefwk=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout canonical-pdlrefwk
        uses: actions/checkout@v7
        with:
          repository: PerseusDLCode/canonical-pdlrefwk
          ref: dev
          path: canonical-pdlrefwk

      - name: Upload as a shared artifact
        uses: actions/upload-artifact@v7
        with:
          name: canonical-pdlrefwk
          path: canonical-pdlrefwk
          retention-days: 1

  build:
    needs: fetch-pdlrefwk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          # `name` must stay case-sensitive — it's the literal corpus
          # directory name app.py's _discover_corpora keys everything on
          # (CORPUS_NAME build-arg, CORPORA_DIR/<name>, etc). `tag_name` is
          # a separate lowercase-only variant for GHCR repository paths —
          # both Docker and oras reject uppercase there ("invalid
          # repository"), unlike image *tags*, which do allow it.
          - name: greekLit
            tag_name: greeklit
            repo_url: https://github.com/PerseusDLCode/canonical-greekLit
            branch: editing
          - name: latinLit
            tag_name: latinlit
            repo_url: https://github.com/PerseusDLCode/canonical-latinLit
            branch: editing
          # NOTE: this corpus's own __cts__.xml files declare "hebrewLit"
          # (see _CORPUS_LABELS/_CORPUS_REPO in app.py), but the directory
          # name actually used at runtime — and so the "corpus" _discover_
          # corpora keys everything on — is "First1KGreek", matching this
          # repo's name. _CORPUS_LABELS has no entry for "First1KGreek", so
          # today it displays as the raw string "First1KGreek" rather than
          # a proper label. Pre-existing mismatch, not introduced by this
          # workflow — flagging rather than silently picking a side.
          - name: First1KGreek
            tag_name: first1kgreek
            repo_url: https://github.com/PerseusDLCode/First1KGreek
            branch: editing
    steps:
      - name: Skip corpora not requested via workflow_dispatch
        id: gate
        run: |
          if [ -n "${{ inputs.corpus }}" ] && [ "${{ inputs.corpus }}" != "${{ matrix.name }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
        with:
          ref: dev

      - name: Download shared canonical-pdlrefwk artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@v8
        with:
          name: canonical-pdlrefwk
          path: canonical-pdlrefwk

      # ---------------------------------------------------------- #
      # Resolve this corpus's HEAD SHA — doubles as the Docker
      # cache-buster (see Dockerfile.corpus) and as the digest tagging
      # this corpus's pushed artifact, so an unchanged corpus is a
      # no-op rebuild (see the "Skip if already built" step).
      # ---------------------------------------------------------- #
      - name: Resolve corpus HEAD SHA
        if: steps.gate.outputs.run == 'true'
        id: sha
        run: |
          CORPUS_SHA=$(git ls-remote "${{ matrix.repo_url }}" "refs/heads/${{ matrix.branch }}" | cut -f1)
          if [ -z "$CORPUS_SHA" ]; then
            echo "Could not resolve HEAD SHA for ${{ matrix.repo_url }}@${{ matrix.branch }}" >&2
            exit 1
          fi
          echo "corpus=${CORPUS_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: steps.gate.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install oras
        if: steps.gate.outputs.run == 'true'
        uses: oras-project/setup-oras@v1

      - name: Skip if this corpus's SHA is already built
        if: steps.gate.outputs.run == 'true'
        id: skip
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "force=true; rebuilding regardless of cached SHA."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="ghcr.io/perseusdlcode/mvp-corpus-${{ matrix.tag_name }}:${{ steps.sha.outputs.corpus }}"
          if oras manifest fetch "$TAG" >/dev/null 2>&1; then
            echo "Already built: $TAG"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.gate.outputs.run == 'true' && steps.skip.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build corpus builder image (not pushed — see file header)
        if: steps.gate.outputs.run == 'true' && steps.skip.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.corpus
          push: false
          load: true
          tags: mvp-corpus-builder:${{ matrix.name }}
          build-args: |
            CORPUS_NAME=${{ matrix.name }}
            CORPUS_REPO_URL=${{ matrix.repo_url }}
            CORPUS_BRANCH=${{ matrix.branch }}
            CORPUS_SHA=${{ steps.sha.outputs.corpus }}
          cache-from: type=gha,scope=corpus-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=corpus-${{ matrix.name }}

      # ---------------------------------------------------------- #
      # Run the freeze. manifest.json is written inside FREEZER_
      # DESTINATION (see build() in app.py), so the one bind mount
      # below captures both the frozen pages and the manifest.
      # ---------------------------------------------------------- #
      - name: Run corpus-only build
        if: steps.gate.outputs.run == 'true' && steps.skip.outputs.skip != 'true'
        run: |
          mkdir -p "$PWD/out"
          docker run --rm \
            -e MORPH_URL="${{ vars.MORPH_URL }}" \
            -v "$PWD/out:/app/build" \
            mvp-corpus-builder:${{ matrix.name }} \
            --source-digest "${{ steps.sha.outputs.corpus }}"

      - name: Pull manifest.json out of the pages tree
        if: steps.gate.outputs.run == 'true' && steps.skip.outputs.skip != 'true'
        run: mv out/manifest.json manifest.json

      - name: Package frozen pages
        if: steps.gate.outputs.run == 'true' && steps.skip.outputs.skip != 'true'
        run: tar --zstd -cf pages.tar.zst -C out .

      # ---------------------------------------------------------- #
      # Two artifacts per corpus: the (large) pages tarball, and the
      # (tiny) manifest, tagged separately so build-global.yml never
      # has to pull page content just to read a manifest.
      # ---------------------------------------------------------- #
      - name: Push pages artifact
        if: steps.gate.outputs.run == 'true' && steps.skip.outputs.skip != 'true'
        run: |
          oras push "ghcr.io/perseusdlcode/mvp-corpus-${{ matrix.tag_name }}:${{ steps.sha.outputs.corpus }}" \
            pages.tar.zst:application/vnd.perseus.mvp.pages
          oras tag "ghcr.io/perseusdlcode/mvp-corpus-${{ matrix.tag_name }}:${{ steps.sha.outputs.corpus }}" latest

      - name: Push manifest artifact
        if: steps.gate.outputs.run == 'true' && steps.skip.outputs.skip != 'true'
        run: |
          oras push "ghcr.io/perseusdlcode/mvp-corpus-${{ matrix.tag_name }}-manifest:${{ steps.sha.outputs.corpus }}" \
            manifest.json:application/vnd.perseus.mvp.manifest+json
          oras tag "ghcr.io/perseusdlcode/mvp-corpus-${{ matrix.tag_name }}-manifest:${{ steps.sha.outputs.corpus }}" latest
