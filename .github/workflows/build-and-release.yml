name: Build and Push to GHCR

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      # ---------------------------------------------------------- #
      # 1. SOURCE
      # ---------------------------------------------------------- #
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: dev
      
      # Clone canonical_pdlrefwk (private one)
      - name: Checkout canonical_pdlrefwk repository
        uses: actions/checkout@v7
        with:
          repository: https://github.com/PerseusDLCode/canonical_pdlrefwk.git
          token: ${{ secrets.REFWK_REPO_PAT }}
          path: pdlrefwk

      # ---------------------------------------------------------- #
      # 2. CORPUS CACHE-BUSTING
      #
      # Query the HEAD commit SHA of each corpus's `editing` branch.
      # These SHAs are passed to `docker build` as --build-args.
      # When a SHA changes (i.e., new commits to the corpus), Docker
      # invalidates the clone layer and re-clones. When they haven't
      # changed, the cached corpus layer is reused — meaning a push
      # to `dev` that only touches Python code skips re-cloning
      # several hundred MB of XML.
      # ---------------------------------------------------------- #
      - name: Get corpus HEAD SHAs
        id: corpus
        run: |
          GREEK=$(git ls-remote \
            https://github.com/PerseusDLCode/canonical-greekLit \
            refs/heads/editing | cut -f1)
          LATIN=$(git ls-remote \
            https://github.com/PerseusDLCode/canonical-latinLit \
            refs/heads/editing | cut -f1)
          echo "greek=${GREEK}" >> "$GITHUB_OUTPUT"
          echo "latin=${LATIN}" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------- #
      # 3. LOGIN TO GHCR
      # ---------------------------------------------------------- #
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------- #
      # 4. DOCKER BUILD & PUSH
      #
      # Builds a slim "builder" image containing deps + corpora +
      # source code (but NOT the heavy build/ output). The image is
      # pushed to GHCR with two tags:
      #   - dev-<ts>-<sha>  (unique per build, for rollback)
      #   - dev-latest      (mutable, polled by the VM cron)
      #
      # The corpora SHAs act as cache-busters for Docker layer
      # caching via type=gha.
      # ---------------------------------------------------------- #
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/perseusdlcode/minimumviableperseus:dev-latest
            ghcr.io/perseusdlcode/minimumviableperseus:dev-${{ github.run_id }}-${{ github.sha }}
          build-args: |
            GREEK_CORPUS_SHA=${{ steps.corpus.outputs.greek }}
            LATIN_CORPUS_SHA=${{ steps.corpus.outputs.latin }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
